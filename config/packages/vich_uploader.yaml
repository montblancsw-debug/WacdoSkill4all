vich_uploader:
    db_driver: orm

    metadata:
        type: attribute

    mappings:
        produits:
            uri_prefix: /images/produits
            upload_destination: '%kernel.project_dir%/public/images/produits'
            namer: App\Service\OriginalFileNamer

        categories:
            uri_prefix: /images/categories
            upload_destination: '%kernel.project_dir%/public/images/categories'
            namer: App\Service\OriginalFileNamer

        menus:
            uri_prefix: /images/menus
            upload_destination: '%kernel.project_dir%/public/images/menus'
            namer: App\Service\OriginalFileNamer