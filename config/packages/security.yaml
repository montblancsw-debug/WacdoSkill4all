security:

    # Utilise bcrypt pour rester compatible avec les mots de passe Wacdo existants.
    password_hashers:
        App\Entity\Utilisateur:
            algorithm: bcrypt

    # Charge les utilisateurs depuis la base de données.
    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: utilisateur_email

    firewalls:

        # Désactive la sécurité pour les outils de développement et les assets.
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall principal de l'application.
        main:
            lazy: true

            # Utilise les utilisateurs enregistrés en base.
            provider: app_utilisateur_provider

            # Utilise notre formulaire de connexion personnalisé.
            custom_authenticators:
                - App\Security\AppAuthenticator

            # Configure la déconnexion.
            logout:
                path: app_logout
                target: app_login

            # Permet de rester connecté.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Les routes seront protégées dans l'étape suivante.
    access_control: []


when@test:

    security:

        password_hashers:

            App\Entity\Utilisateur:
                algorithm: bcrypt
                cost: 4