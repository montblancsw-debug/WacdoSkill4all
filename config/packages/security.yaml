security:

    # Utilise bcrypt pour les mots de passe Wacdo.
    password_hashers:
        App\Entity\Utilisateur:
            algorithm: bcrypt

    # Charge les utilisateurs depuis la base de données.
    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: utilisateur_email

    firewalls:

        # Désactive la sécurité pour les outils de développement.
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall principal de Wacdo.
        main:
            lazy: true

            # Utilise les utilisateurs Wacdo.
            provider: app_utilisateur_provider

            # Utilise notre authenticator.
            custom_authenticators:
                - App\Security\AppAuthenticator

            # Configure la déconnexion.
            logout:
                path: app_logout
                target: app_login

            # Permet de rester connecté.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Sécurise les différentes zones de l'application.
    access_control:

        # La connexion reste accessible sans authentification.
        - { path: ^/login$, roles: PUBLIC_ACCESS }

        # Le back-office nécessite un utilisateur connecté.
        # Une connexion Remember Me est également acceptée.
        - { path: ^/admin, roles: IS_AUTHENTICATED }


when@test:

    security:

        password_hashers:

            App\Entity\Utilisateur:
                algorithm: bcrypt
                cost: 4