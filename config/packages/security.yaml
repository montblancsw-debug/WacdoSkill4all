security:

    # Utilise bcrypt pour les mots de passe Wacdo.
    password_hashers:
        App\Entity\Utilisateur:
            algorithm: bcrypt

    # Charge les utilisateurs depuis la base de données.
    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: utilisateur_email

    firewalls:

        # Désactive la sécurité pour les outils de développement.
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # Firewall principal de Wacdo.
        main:
            lazy: true

            # Utilise les utilisateurs Wacdo.
            provider: app_utilisateur_provider

            # Utilise notre authenticator.
            custom_authenticators:
                - App\Security\AppAuthenticator

            # Configure la déconnexion.
            logout:
                path: app_logout
                target: app_login

            # Permet de rester connecté.
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    # Définit les droits d'accès aux différentes zones.
    access_control:

        # La page de connexion reste publique.
        - { path: '^/login$', roles: PUBLIC_ACCESS }

        # Seul l'administrateur gère les utilisateurs.
        - { path: '^/admin/utilisateur', roles: ROLE_ADMIN }

        # Seul l'administrateur gère les catégories.
        - { path: '^/admin/categorie', roles: ROLE_ADMIN }

        # Seul l'administrateur gère les produits.
        - { path: '^/admin/produit', roles: ROLE_ADMIN }

        # Les trois rôles peuvent gérer les commandes.
        - { path: '^/admin/commande', roles: [ROLE_ADMIN, ROLE_PREPARATEUR, ROLE_ACCUEIL] }

        # Les trois rôles peuvent accéder au Dashboard.
        - { path: '^/admin/dashboard$', roles: [ROLE_ADMIN, ROLE_PREPARATEUR, ROLE_ACCUEIL] }

        # Les trois rôles peuvent accéder à /admin.
        - { path: '^/admin$', roles: [ROLE_ADMIN, ROLE_PREPARATEUR, ROLE_ACCUEIL] }

        # Toute autre URL /admin reste réservée à l'administrateur.
        - { path: '^/admin', roles: ROLE_ADMIN }


when@test:

    security:

        password_hashers:

            App\Entity\Utilisateur:
                algorithm: bcrypt
                cost: 4